<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旭工業㈱ 年計表（会社沿革）</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      background: #0d1b2a;
      color: #e8eaf0;
      overflow-x: hidden;
    }

    .color-bar {
      height: 4px;
      background: linear-gradient(90deg, #f4a022, #e05050, #6060e0, #20b0a0, #f4a022);
      background-size: 200% 100%;
      animation: barMove 6s linear infinite;
    }
    @keyframes barMove {
      0% { background-position: 0% 0%; }
      100% { background-position: 200% 0%; }
    }

    .header {
      padding: 40px 60px 20px;
      display: flex;
      align-items: flex-end;
      gap: 24px;
    }
    .header-logo {
      font-size: 11px;
      letter-spacing: 0.18em;
      color: #f4a022;
      font-weight: 700;
      text-transform: uppercase;
    }
    .header-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #ffffff;
    }
    .header-sub {
      font-size: 12px;
      color: #7a8aab;
      letter-spacing: 0.12em;
      margin-left: auto;
      padding-bottom: 4px;
    }

    /* ---- ツールバー ---- */
    .toolbar {
      margin: 0 60px 10px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .btn-reload {
      background: #f4a022;
      color: #0d1b2a;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.1em;
      border: none;
      padding: 9px 20px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s;
    }
    .btn-reload:hover { opacity: 0.85; }
    .status-msg {
      font-size: 11px;
      color: #7a8aab;
      letter-spacing: 0.08em;
      min-height: 16px;
    }
    .status-msg.error { color: #e05050; }
    .status-msg.ok    { color: #50d080; }

    /* ---- スクロールヒント ---- */
    .scroll-hint {
      text-align: center;
      font-size: 11px;
      color: #4a5a7a;
      letter-spacing: 0.12em;
      padding: 4px 0 6px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:.5} 50%{opacity:1} }

    /* ---- タイムラインコンテナ（年代バー + スクロール領域を縦に積む） ---- */
    .timeline-outer {
      margin: 0 60px 40px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #1e3050;
    }

    /* 年代バー（固定行） */
    .era-bar-wrapper {
      overflow-x: hidden; /* スクロール位置はJSで同期 */
      background: #111e30;
      border-bottom: 2px solid #f4a022;
    }
    .era-bar {
      display: flex;
      min-width: max-content;
    }
    .era-bar-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 280px;
      padding: 10px 16px;
      position: relative;
    }
    .era-bar-cell + .era-bar-cell::before {
      content: '';
      position: absolute;
      left: 0; top: 20%; bottom: 20%;
      width: 1px;
      background: #2a3f5a;
    }
    .era-year {
      background: #f4a022;
      color: #0d1b2a;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.1em;
      padding: 5px 14px;
      border-radius: 20px;
      white-space: nowrap;
    }

    /* ---- スクロール領域 ---- */
    .timeline-wrapper {
      overflow-x: auto;
      padding: 0 0 10px;
      scrollbar-width: thin;
      scrollbar-color: #f4a022 #1a2a40;
      cursor: grab;
    }
    .timeline-wrapper:active { cursor: grabbing; }
    .timeline-wrapper::-webkit-scrollbar { height: 5px; }
    .timeline-wrapper::-webkit-scrollbar-track { background: #1a2a40; }
    .timeline-wrapper::-webkit-scrollbar-thumb { background: #f4a022; border-radius: 3px; }

    .timeline {
      display: flex;
      align-items: stretch;
      min-width: max-content;
      padding: 20px 0 20px;
      position: relative;
    }
    .timeline::before {
      content: '';
      position: absolute;
      top: 50%; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent 0%, #2a3f5a 3%, #2a3f5a 97%, transparent 100%);
      transform: translateY(-50%);
      pointer-events: none;
    }

    .era {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      min-width: 280px;
      padding: 0 16px;
    }
    .events-top, .events-bottom {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      min-height: 200px;
    }
    .events-top    { justify-content: flex-end; padding-bottom: 20px; }
    .events-bottom { justify-content: flex-start; padding-top: 20px; }

    /* 中央ライン上のドット */
    .era-dot {
      position: relative;
      z-index: 2;
      width: 12px; height: 12px;
      background: #f4a022;
      border-radius: 50%;
      border: 2px solid #0d1b2a;
      flex-shrink: 0;
    }

    .card {
      background: #162032;
      border: 1px solid #253550;
      border-radius: 10px;
      padding: 14px 16px;
      width: 240px;
      transition: all 0.2s ease;
      cursor: default;
    }
    .card:hover {
      border-color: #f4a022;
      background: #1e2e45;
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(244,160,34,0.15);
    }
    .card-year  { font-size: 10px; color: #f4a022; font-weight: 700; letter-spacing: .15em; margin-bottom: 5px; }
    .card-title { font-size: 13px; font-weight: 700; color: #e8eaf0; margin-bottom: 6px; line-height: 1.5; }
    .card-desc  { font-size: 11px; color: #7a8aab; line-height: 1.7; }
    .card-tag {
      display: inline-block;
      margin-top: 8px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .12em;
      padding: 2px 8px;
      border-radius: 10px;
    }
    .tag-founding   { background:#2a4020; color:#7dc05a; }
    .tag-expansion  { background:#1e3050; color:#6aaee0; }
    .tag-product    { background:#3a2050; color:#b080e0; }
    .tag-milestone  { background:#3a2820; color:#e09050; }
    .tag-innovation { background:#1e3838; color:#50d0b0; }

    /* ローディング */
    .loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #0d1b2acc;
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }
    .loading-overlay.show { display: flex; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #2a3f5a;
      border-top-color: #f4a022;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 13px; color: #7a8aab; letter-spacing: .12em; }

    .footer {
      text-align: center;
      font-size: 10px;
      color: #2a3a55;
      letter-spacing: .12em;
      padding: 10px 0 30px;
    }

    /* 空状態 */
    .empty-state {
      text-align: center;
      padding: 60px 0;
      color: #3a4a6a;
      font-size: 13px;
      letter-spacing: .1em;
      width: 100%;
    }
  </style>
</head>
<body>

<div class="color-bar"></div>

<div class="header">
  <div>
    <div class="header-logo">ASAHI KOGYO CO., LTD.</div>
    <div class="header-title">旭工業㈱ 年計表 — 会社沿革</div>
  </div>
  <div class="header-sub" id="headerSub">— データ未読込 —</div>
</div>

<!-- ツールバー -->
<div class="toolbar">
  <button class="btn-reload" onclick="loadFromGas()">🔄 データを更新</button>
  <div class="status-msg" id="statusMsg">読み込み中…</div>
</div>

<div class="scroll-hint">← 横にスクロール →</div>

<div class="timeline-outer">
  <!-- 年代バー（固定位置・スクロール同期） -->
  <div class="era-bar-wrapper" id="eraBarWrapper">
    <div class="era-bar" id="eraBar"></div>
  </div>
  <!-- イベントカード スクロール領域 -->
  <div class="timeline-wrapper" id="timelineWrapper">
    <div class="timeline" id="timeline">
      <div class="empty-state">データを読み込んでいます…</div>
    </div>
  </div>
</div>

<div class="footer">© 旭工業株式会社　ASAHI KOGYO CO., LTD. — COMPANY HISTORY INFOGRAPHIC</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text">データを読み込んでいます…</div>
</div>

<script>
// ============================
//  Google Apps Script WebアプリURL（固定）
// ============================
const GAS_URL = 'https://script.google.com/macros/s/AKfycbywOHXSSJZIW6pPb9i44tqs21ylFtVZpBMWq_eO4ECYmSr1SwuXulwqF1gOUcjKgeVQBg/exec';

// ============================
//  フォールバック用データ（GAS接続不可時に使用）
// ============================
const FALLBACK_DATA = [
  { era:"1960年代", year:"1962", title:"旭工業㈱ 創業", desc:"東京都にて金属プレス加工業として創業。資本金300万円・従業員8名でスタート。", tag:"founding", position:"top" },
  { era:"1960年代", year:"1966", title:"東京本社工場 竣工", desc:"初代本社工場を竣工。自動プレス機を導入し量産体制を確立。", tag:"founding", position:"bottom" },
  { era:"1970年代", year:"1971", title:"自動車・家電部品 参入", desc:"大手自動車・家電メーカーへの精密プレス部品供給を開始。品質優先の生産体制を構築。", tag:"expansion", position:"top" },
  { era:"1970年代", year:"1974", title:"埼玉工場 開設", desc:"生産能力拡大のため埼玉県に第一工場を開設。首都圏の主要取引先への供給体制を強化。", tag:"expansion", position:"bottom" },
  { era:"1970年代", year:"1978", title:"従業員100名突破", desc:"埼玉工場の本格稼働により雇用が拡大。グループ全体で100名を超える体制へ。", tag:"milestone", position:"top" },
  { era:"1980年代", year:"1982", title:"NC・自動化設備 導入", desc:"NC自動プレス機・自動搬送設備を全工場に導入。生産効率と品質精度を大幅向上。", tag:"innovation", position:"bottom" },
  { era:"1980年代", year:"1985", title:"創業20周年", desc:"資本金・売上ともに創業比10倍以上に成長。感謝の集いを開催し取引先・従業員を招待。", tag:"milestone", position:"top" },
  { era:"1980年代", year:"1988", title:"埼玉工場 増設", desc:"埼玉工場の敷地内に第二棟を増設。大型プレス機を導入し大物部品の内製化を実現。", tag:"expansion", position:"bottom" },
  { era:"1990年代", year:"1991", title:"ISO 9001 取得", desc:"品質マネジメントシステム国際認証を全拠点で取得。主要メーカーへの信頼性が向上。", tag:"milestone", position:"top" },
  { era:"1990年代", year:"1995", title:"岩手工場 開設", desc:"岩手県に東北初の生産拠点を開設。地域雇用創出とコスト競争力強化を両立。", tag:"expansion", position:"bottom" },
  { era:"1990年代", year:"1998", title:"CAD/CAM 全社展開", desc:"3次元設計・金型製作システムを全工場に展開。金型内製化率を大幅向上。", tag:"innovation", position:"top" },
  { era:"2000年代", year:"2001", title:"東京本社 移転・拡充", desc:"本社機能を現住所（東京都）の新社屋へ移転。営業・設計・管理部門を集約。", tag:"milestone", position:"bottom" },
  { era:"2000年代", year:"2004", title:"ISO 14001 取得", desc:"環境マネジメントシステム認証を取得。3拠点での廃棄物削減・省エネ活動を開始。", tag:"milestone", position:"top" },
  { era:"2000年代", year:"2007", title:"岩手工場 増設", desc:"岩手工場に第二棟を増設。東北・北関東向け部品の生産能力を2倍に拡大。", tag:"expansion", position:"bottom" },
  { era:"2000年代", year:"2009", title:"創業45周年・リーマンショック対応", desc:"受注急減の中、全社コスト再構築と多能工化推進により黒字経営を維持。", tag:"milestone", position:"top" },
  { era:"2010年代", year:"2011", title:"東日本大震災 事業継続", desc:"岩手工場の早期復旧を実現。BCPの整備と相互支援体制（埼玉・岩手間）を確立。", tag:"milestone", position:"bottom" },
  { era:"2010年代", year:"2013", title:"ロボット溶接・自動化ライン 稼働", desc:"埼玉工場に協働ロボットを導入。溶接工程の自動化で品質安定化と省人化を達成。", tag:"innovation", position:"top" },
  { era:"2010年代", year:"2016", title:"高張力鋼板（ハイテン）対応", desc:"自動車の軽量化ニーズに対応した高張力鋼板プレス加工技術を確立。新規受注を拡大。", tag:"product", position:"bottom" },
  { era:"2010年代", year:"2018", title:"EV・次世代自動車部品 参入", desc:"電動車向けバッテリーケース・モーターブラケット等の精密部品製造を開始。", tag:"product", position:"top" },
  { era:"2010年代", year:"2019", title:"岩手工場 スマート化", desc:"岩手工場にIoTセンサー・生産管理システムを導入。稼働率・品質データのリアルタイム可視化を実現。", tag:"innovation", position:"bottom" },
  { era:"2020年代", year:"2020", title:"DX推進・テレワーク体制整備", desc:"コロナ禍を契機にDX推進室を新設。設計・管理部門のペーパーレス化・テレワークを実現。", tag:"innovation", position:"top" },
  { era:"2020年代", year:"2021", title:"カーボンニュートラル宣言", desc:"2035年CO₂排出量50%削減を目標に設定。太陽光パネルを埼玉・岩手工場に設置。", tag:"milestone", position:"bottom" },
  { era:"2020年代", year:"2022", title:"創業60周年", desc:"従業員約400名・3拠点体制で創業60周年を迎える。記念式典および地域社会への感謝活動を実施。", tag:"milestone", position:"top" },
  { era:"2020年代", year:"2024", title:"次世代EV部品 量産体制確立", desc:"全固体電池・燃料電池向け精密プレス部品の量産ラインを埼玉工場に新設。", tag:"product", position:"bottom" },
  { era:"2020年代", year:"2026", title:"創業64年・更なる飛躍へ", desc:"東京・埼玉・岩手の3拠点連携を深化。「確かな技術で社会を支える」理念のもと次の60年へ。", tag:"expansion", position:"top" },
];

// ============================
//  タイムライン描画
// ============================
const TAG_LABELS = {
  founding: '創業', expansion: '拠点拡大', product: '製品・技術',
  milestone: '節目', innovation: '革新'
};

function buildTimeline(rows) {
  const timeline = document.getElementById('timeline');
  const eraBar  = document.getElementById('eraBar');
  timeline.innerHTML = '';
  eraBar.innerHTML   = '';

  const eraMap = new Map();
  rows.forEach(r => {
    const era = String(r.era || '').trim();
    if (!era) return;
    if (!eraMap.has(era)) eraMap.set(era, []);
    eraMap.get(era).push(r);
  });

  if (eraMap.size === 0) {
    timeline.innerHTML = '<div class="empty-state">データが空です。スプレッドシートの内容を確認してください。</div>';
    return;
  }

  eraMap.forEach((events, era) => {
    const topEvents = events.filter(e => String(e.position).trim() === 'top');
    const botEvents = events.filter(e => String(e.position).trim() === 'bottom');

    // ── 年代バーセル ──
    const cell = document.createElement('div');
    cell.className = 'era-bar-cell';
    cell.innerHTML = `<div class="era-year">${era}</div>`;
    eraBar.appendChild(cell);

    // ── カード列 ──
    const col = document.createElement('div');
    col.className = 'era';

    const topDiv = document.createElement('div');
    topDiv.className = 'events-top';
    topEvents.forEach(ev => topDiv.appendChild(makeCard(ev)));

    // 中央ドット（ラベルの代わり）
    const dot = document.createElement('div');
    dot.className = 'era-dot';

    const botDiv = document.createElement('div');
    botDiv.className = 'events-bottom';
    botEvents.forEach(ev => botDiv.appendChild(makeCard(ev)));

    col.appendChild(topDiv);
    col.appendChild(dot);
    col.appendChild(botDiv);
    timeline.appendChild(col);
  });
}

function makeCard(ev) {
  const card = document.createElement('div');
  card.className = 'card';
  const tag = String(ev.tag || 'milestone').trim();
  const tagClass = `tag-${tag}`;
  const tagText = TAG_LABELS[tag] || tag;
  card.innerHTML = `
    <div class="card-year">${ev.year}</div>
    <div class="card-title">${ev.title}</div>
    <div class="card-desc">${ev.desc}</div>
    ${tagText ? `<span class="card-tag ${tagClass}">${tagText}</span>` : ''}
  `;
  return card;
}

function setStatus(msg, type = '') {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = `status-msg ${type}`;
}

function setHeaderSub(text) {
  document.getElementById('headerSub').textContent = text;
}

function showLoading(v) {
  document.getElementById('loadingOverlay').classList.toggle('show', v);
}

// ============================
//  GAS からデータ取得
// ============================
async function loadFromGas() {
  showLoading(true);
  setStatus('スプレッドシートからデータを取得中…');

  try {
    // GASはリダイレクトが発生するため no-cors ではなく cors モードで fetch
    const res = await fetch(GAS_URL, { redirect: 'follow' });
    if (!res.ok) throw new Error(`サーバーエラー (HTTP ${res.status})`);

    const rows = await res.json();
    if (!Array.isArray(rows) || rows.length === 0) {
      throw new Error('データが0件です。スプレッドシートの内容を確認してください。');
    }

    buildTimeline(rows);

    const years = rows.map(r => Number(r.year)).filter(y => !isNaN(y) && y > 0);
    if (years.length) {
      setHeaderSub(`${Math.min(...years)}年 〜 ${Math.max(...years)}年`);
    }
    setStatus(`✅ ${rows.length} 件のイベントを読み込みました（スプレッドシート反映済み）`, 'ok');

  } catch (e) {
    // GAS接続失敗時はフォールバックデータで表示
    console.warn('GAS接続エラー。フォールバックデータを使用します:', e.message);
    buildTimeline(FALLBACK_DATA);
    setHeaderSub('1962年 〜 2026年');
    setStatus(`⚠️ スプレッドシート接続不可のため内蔵データを表示中 (${e.message})`, 'error');
  } finally {
    showLoading(false);
  }
}

// ============================
//  ドラッグスクロール ＋ 年代バー同期
// ============================
const wrapper    = document.getElementById('timelineWrapper');
const eraBarWrap = document.getElementById('eraBarWrapper');

// スクロール時に年代バーを同期
wrapper.addEventListener('scroll', () => {
  eraBarWrap.scrollLeft = wrapper.scrollLeft;
});

let isDown = false, startX, scrollLeft;
wrapper.addEventListener('mousedown', e => { isDown = true; startX = e.pageX - wrapper.offsetLeft; scrollLeft = wrapper.scrollLeft; });
wrapper.addEventListener('mouseleave', () => isDown = false);
wrapper.addEventListener('mouseup',    () => isDown = false);
wrapper.addEventListener('mousemove', e => {
  if (!isDown) return;
  e.preventDefault();
  wrapper.scrollLeft = scrollLeft - (e.pageX - wrapper.offsetLeft - startX);
});

// ============================
//  ページ読み込み時に自動取得
// ============================
window.addEventListener('DOMContentLoaded', () => loadFromGas());
</script>
</body>
</html>
