      scrollbar-width:thin;
      scrollbar-color:#f4a022 #1a2a40;
      border:1px solid #1e3050;
      border-radius:12px;
      cursor:grab;
    }
    .main-scroll:active { cursor:grabbing; }
    .main-scroll::-webkit-scrollbar { height:6px; width:6px; }
    .main-scroll::-webkit-scrollbar-track { background:#1a2a40; }
    .main-scroll::-webkit-scrollbar-thumb { background:#f4a022; border-radius:3px; }

    .scroll-inner { display:flex; flex-direction:column; min-width:max-content; }

    /* ---- 年代バー行（sticky top） ---- */
    .era-row {
      display:flex;
      position:sticky; top:0; z-index:20;
      background:#111e30;
      border-bottom:2px solid #f4a022;
    }
    /* 年代セル：span分だけ幅を掛ける */

      flex-shrink:0;
      display:flex; align-items:center; justify-content:center;

      border-right:1px solid #2a3f5a;
    }

    .era-badge {
      background:#f4a022; color:#0d1b2a;
      font-size:13px; font-weight:900; letter-spacing:.1em;
      padding:5px 14px; border-radius:20px; white-space:nowrap;
    }

    .cards-row { display:flex; }
    .cards-col {
      flex-shrink:0;
      width:var(--col-w);
      padding:14px 10px;
      display:flex; flex-direction:column; gap:10px;
      border-right:1px solid #1a2a3a;
      background:#0d1b2a;
    }
    .cards-col:last-child { border-right:none; }
    .cards-col.no-cards { background:#0a1218; min-height:50px; }

    /* 折り返し列（同年代の2列目以降）は左ボーダーを破線で区別 */
    .cards-col.overflow-col { border-left:1px dashed #2a3f5a; background:#0b1825; }

    /* ---- 会社カード ---- */
    .card { background:#162032; border:1px solid #253550; border-radius:10px; padding:11px 13px; transition:all .2s; cursor:default; }

    .card-title { font-size:12px; font-weight:700; color:#e8eaf0; margin-bottom:4px; line-height:1.5; }
    .card-desc  { font-size:10px; color:#7a8aab; line-height:1.65; }
    .card-tag { display:inline-block; margin-top:5px; font-size:9px; font-weight:700; letter-spacing:.1em; padding:2px 8px; border-radius:10px; }
    .tag-founding   { background:#2a4020; color:#7dc05a; }
    .tag-expansion  { background:#1e3050; color:#6aaee0; }
    .tag-product    { background:#3a2050; color:#b080e0; }
    .tag-milestone  { background:#3a2820; color:#e09050; }
    .tag-innovation { background:#1e3838; color:#50d0b0; }

    .world-row {
      display:flex;
      position:sticky; bottom:0; z-index:20;
      background:#080f1a;
      border-top:2px solid #f4a022;
    }
    .world-label-col {
      position:sticky; left:0; z-index:25;
      background:#0d1625; border-right:2px solid #f4a022;
      display:flex; flex-direction:column; justify-content:center; align-items:center;
      padding:8px 12px; min-width:72px;
    }
    .world-label-main {
      font-size:10px; font-weight:800; letter-spacing:.14em;
      color:#f4a022; writing-mode:vertical-rl; white-space:nowrap;
    }
    /* 世の中セル：span分だけ幅を掛ける */
    .world-cell {
      flex-shrink:0;
      display:grid;
      grid-template-columns:1fr 1fr;
      grid-template-rows:1fr 1fr;
      gap:4px;
      padding:5px 7px;
      border-right:1px solid #1a2a3a;
    }
    .world-cell:last-child { border-right:none; }

    .world-cat { font-size:8px; font-weight:700; letter-spacing:.08em; margin-bottom:2px; }

    .world-cat.world { color:#e09050; }
    .world-cat.tech  { color:#50d0b0; }
    .world-cat.soc   { color:#b080e0; }
    .world-text { color:#7a8aab; }

    .loading-overlay { display:none; position:fixed; inset:0; background:#0d1b2acc; z-index:100; align-items:center; justify-content:center; flex-direction:column; gap:16px; }
    .loading-overlay.show { display:flex; }

const ALL_ERAS = [
  "1890年代","1900年代","1910年代","1920年代","1930年代","1940年代","1950年代",

// ============================
//  描画
//  年代ごとにカードを CARDS_PER_COL 件ずつ列に分割。
//  年代バー（era-cell）と世の中（world-cell）は span 分の幅を持つ。
// ============================
function buildAll(companyRows, worldRows) {
  const eraRow   = document.getElementById('eraRow');
  const cardsRow = document.getElementById('cardsRow');
  const worldRow = document.getElementById('worldRow');
  const labelCol = worldRow.querySelector('.world-label-col');

  eraRow.innerHTML   = '';
  cardsRow.innerHTML = '';
  worldRow.innerHTML = '';
  worldRow.appendChild(labelCol);

  // 整理
  const eraMap = new Map();
  companyRows.forEach(r => {
    const era = String(r.era||'').trim(); if (!era) return;
    if (!eraMap.has(era)) eraMap.set(era, []);
    eraMap.get(era).push(r);
  });
  const worldMap = new Map();
  worldRows.forEach(r => {
    const era = String(r.era||'').trim(); if (!era) return;
    if (!worldMap.has(era)) worldMap.set(era, []);
    worldMap.get(era).push(r);
  });

  ALL_ERAS.forEach(era => {
    const events     = [...(eraMap.get(era)||[])].sort((a,b)=>Number(a.year)-Number(b.year));
    const worldItems = worldMap.get(era) || [];

    // 何列必要か計算（最低1列）
    const colCount = Math.max(1, Math.ceil(events.length / CARDS_PER_COL));
    const spanW    = COL_W * colCount; // 年代バー・世の中セルの幅

    // ── 年代バーセル（colCount 列分の幅） ──
    const eraCell = document.createElement('div');
    eraCell.className = 'era-cell';
    eraCell.style.width = spanW + 'px';
    eraCell.innerHTML = `<div class="era-badge">${era}</div>`;
    eraRow.appendChild(eraCell);

    // ── 会社カード列（CARDS_PER_COL 件ずつ分割） ──
    for (let ci = 0; ci < colCount; ci++) {
      const slice = events.slice(ci * CARDS_PER_COL, (ci + 1) * CARDS_PER_COL);
      const col = document.createElement('div');
      col.className = 'cards-col' + (ci > 0 ? ' overflow-col' : '') + (events.length === 0 ? ' no-cards' : '');
      slice.forEach(ev => col.appendChild(makeCard(ev)));
      cardsRow.appendChild(col);
    }

    // ── 世の中セル（colCount 列分の幅） ──
    const wCell = document.createElement('div');
    wCell.className = 'world-cell';
    wCell.style.width = spanW + 'px';
    worldItems.forEach(item => {
      const el = document.createElement('div');
      el.className = 'world-item';
      el.innerHTML = `<div class="world-cat ${item.cat}">${item.label}</div><div class="world-text">${item.text}</div>`;
      wCell.appendChild(el);
    });
    worldRow.appendChild(wCell);
  });
}

function makeCard(ev) {
  const card = document.createElement('div');
  card.className = 'card';
  const tag = String(ev.tag||'milestone').trim();
  card.innerHTML = `
    <div class="card-year">${ev.year}</div>
    <div class="card-title">${ev.title}</div>
    <div class="card-desc">${ev.desc}</div>
    <span class="card-tag tag-${tag}">${TAG_LABELS[tag]||tag}</span>
  `;
  return card;
}

function setStatus(msg, type='') {
  const el = document.getElementById('statusMsg');
  el.textContent = msg; el.className = `status-msg ${type}`;
}
function setHeaderSub(t) { document.getElementById('headerSub').textContent = t; }
function showLoading(v)   { document.getElementById('loadingOverlay').classList.toggle('show', v); }

async function loadFromGas() {
  showLoading(true);
  setStatus('スプレッドシートからデータを取得中…');
  try {
    const res = await fetch(GAS_URL, { redirect:'follow' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    let companyRows, worldRows;
    if (data && data.company && data.world) {
      companyRows = data.company; worldRows = data.world;
    } else if (Array.isArray(data)) {
      companyRows = data; worldRows = FALLBACK_WORLD;
    } else {
      throw new Error('データ形式が不正です。');
    }
    buildAll(companyRows, worldRows);
    const years = companyRows.map(r=>Number(r.year)).filter(y=>!isNaN(y)&&y>0);
    if (years.length) setHeaderSub(`${Math.min(...years)}年 〜 ${Math.max(...years)}年`);
    setStatus(`✅ 会社 ${companyRows.length}件 / 世の中 ${worldRows.length}件`, 'ok');
  } catch(e) {
    buildAll(FALLBACK_COMPANY, FALLBACK_WORLD);
    setHeaderSub('1890年代 〜 2026年');
    setStatus(`⚠️ 内蔵データを表示中 (${e.message})`, 'error');
  } finally {
    showLoading(false);
  }
}

// ドラッグスクロール
const ms = document.getElementById('mainScroll');
let isDown=false, startX, startY, sLeft, sTop;
ms.addEventListener('mousedown', e=>{ isDown=true; startX=e.pageX-ms.offsetLeft; startY=e.pageY-ms.offsetTop; sLeft=ms.scrollLeft; sTop=ms.scrollTop; });
ms.addEventListener('mouseleave', ()=>isDown=false);
ms.addEventListener('mouseup',    ()=>isDown=false);
ms.addEventListener('mousemove', e=>{
  if(!isDown) return; e.preventDefault();
  ms.scrollLeft = sLeft-(e.pageX-ms.offsetLeft-startX);
  ms.scrollTop  = sTop -(e.pageY-ms.offsetTop -startY);
});

window.addEventListener('DOMContentLoaded', ()=>loadFromGas());
</script>
